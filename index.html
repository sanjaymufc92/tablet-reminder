<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablet Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1614; --surface:#13221F; --surface-2:#101C19; --line:#1E332E; --line-strong:#24403A;
    --text:#EAF3F0; --muted:#86A69C; --muted-dim:#4A6058;
    --mint:#5EEAD4; --coral:#FF6B5B; --amber:#F5B942; --lavender:#B9A6FF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
  .display{font-family:'Space Grotesk',system-ui,sans-serif;}
  .wrap{max-width:480px;margin:0 auto;padding:28px 20px 110px;}

  /* header */
  .header{display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .greeting h1{margin:0;font-size:24px;font-weight:600;}
  .greeting p{margin:4px 0 0;font-size:13px;color:var(--muted);}
  .ring{position:relative;width:60px;height:60px;flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);}
  .ring .ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;}

  /* banner */
  .banner{margin-top:18px;display:flex;align-items:center;gap:10px;background:#18100E;border:1px solid #5A2D26;color:#FF9A8C;
    border-radius:16px;padding:12px 14px;font-size:13px;}
  .banner .dot{width:8px;height:8px;border-radius:50%;background:var(--coral);flex-shrink:0;}

  /* timeline */
  .timeline{margin-top:26px;}
  .slot{display:flex;gap:14px;}
  .slot-rail{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
  .slot-icon{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface-2);
    color:var(--mint);display:flex;align-items:center;justify-content:center;font-size:15px;}
  .slot-line{width:1px;flex:1;background:var(--line);min-height:20px;}
  .slot-body{flex:1;padding-bottom:22px;min-width:0;}
  .slot-title{margin:2px 0 0;font-size:15px;font-weight:600;}
  .slot-window{margin:1px 0 0;font-size:11.5px;color:var(--muted-dim);}
  .slot-empty{font-size:13px;color:var(--muted-dim);margin-top:10px;}
  .slot-items{margin-top:10px;display:flex;flex-direction:column;gap:8px;}

  /* tablet card */
  .card{border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;display:flex;gap:12px;align-items:center;transition:opacity .15s;}
  .card.taken{background:var(--surface-2);border-color:var(--line);opacity:.6;}
  .card.overdue{background:#18100E;border-color:#5A2D26;}
  .check{width:34px;height:34px;border-radius:50%;border:2px solid #3A544D;background:transparent;flex-shrink:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--bg);font-weight:700;}
  .check.on{background:var(--mint);border-color:var(--mint);}
  .card.overdue:not(.taken) .check{border-color:var(--coral);}
  .card-info{min-width:0;flex:1;}
  .card-name{margin:0;font-size:15px;font-weight:500;}
  .card.taken .card-name{color:var(--muted);text-decoration:line-through;}
  .card-meta{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .time-txt{font-size:12px;color:var(--muted);}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap;}
  .tag.before{color:var(--amber);border-color:#4A3E22;}
  .tag.after{color:var(--lavender);border-color:#38314F;}
  .tag.any{color:var(--muted);border-color:var(--line-strong);}
  .overdue-badge{flex-shrink:0;font-size:11px;font-weight:600;background:#3A1F1B;color:#FF9A8C;padding:4px 9px;border-radius:999px;}

  .empty-state{margin-top:8px;border:1px dashed var(--line-strong);border-radius:16px;padding:34px 16px;text-align:center;color:var(--muted);}

  /* tablet master */
  .tm-header{display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .tm-header h1{margin:0;font-size:24px;font-weight:600;}
  .tm-header p{margin:4px 0 0;font-size:13px;color:var(--muted);}
  .add-btn{width:42px;height:42px;border-radius:50%;background:var(--mint);color:var(--bg);border:none;cursor:pointer;
    font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .form{margin-top:20px;border-radius:16px;border:1px solid var(--line-strong);background:var(--surface-2);padding:16px;display:none;flex-direction:column;gap:14px;}
  .form.open{display:flex;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .field input[type=text],.field input[type=time]{width:100%;background:var(--bg);border:1px solid var(--line-strong);border-radius:10px;
    padding:10px 12px;color:var(--text);font-size:14px;font-family:inherit;outline:none;}
  .field input:focus{border-color:var(--mint);}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{border-radius:10px;border:1px solid var(--line-strong);background:transparent;color:var(--muted);
    padding:8px 12px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit;}
  .seg button.active{border-color:var(--mint);color:var(--mint);background:#16332D;}
  .form-actions{display:flex;gap:10px;margin-top:2px;}
  .btn{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line-strong);background:transparent;color:var(--muted);
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;}
  .btn.primary{background:var(--mint);color:var(--bg);border-color:var(--mint);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .tm-list{margin-top:18px;display:flex;flex-direction:column;gap:10px;}
  .tm-row{display:flex;align-items:center;gap:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;}
  .tm-row .icon{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface-2);
    color:var(--mint);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;}
  .tm-row .info{min-width:0;flex:1;}
  .tm-row .info p{margin:0;font-size:15px;font-weight:500;}
  .tm-row .info span.sub{font-size:12px;color:var(--muted);}
  .icon-btn{width:32px;height:32px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;border-radius:8px;flex-shrink:0;}
  .icon-btn:hover{color:var(--mint);background:var(--surface-2);}
  .icon-btn.danger:hover{color:var(--coral);}

  /* nav */
  .nav{position:fixed;left:0;right:0;bottom:22px;display:flex;justify-content:center;padding:0 20px;}
  .nav-inner{display:flex;gap:4px;padding:6px;border-radius:18px;border:1px solid var(--line-strong);
    background:rgba(16,28,25,0.92);backdrop-filter:blur(6px);box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .nav-inner button{border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;
    padding:10px 16px;border-radius:12px;cursor:pointer;}
  .nav-inner button.active{background:var(--mint);color:var(--bg);}

  .view{display:none;}
  .view.active{display:block;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== TODAY VIEW ===== -->
  <div id="todayView" class="view active">
    <div class="header">
      <div class="greeting">
        <h1 id="greetingText">Good morning</h1>
        <p id="dateText"></p>
      </div>
      <div class="ring">
        <svg width="60" height="60"><circle cx="30" cy="30" r="26" fill="none" stroke="#1B2E2A" stroke-width="6"/>
          <circle id="ringFill" cx="30" cy="30" r="26" fill="none" stroke="#5EEAD4" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="163.36" stroke-dashoffset="163.36" style="transition:stroke-dashoffset .4s;"/></svg>
        <div class="ring-label" id="ringLabel">0/0</div>
      </div>
    </div>

    <div id="overdueBanner" class="banner hidden">
      <span class="dot"></span><span id="overdueText"></span>
    </div>

    <div class="timeline" id="timeline"></div>
    <div id="todayEmpty" class="empty-state hidden">
      💊<br><br>Add your first tablet in Tablet Master to start tracking today.
    </div>
  </div>

  <!-- ===== TABLET MASTER VIEW ===== -->
  <div id="masterView" class="view">
    <div class="tm-header">
      <div>
        <h1 class="display">Tablet Master</h1>
        <p>Every tablet you take, in one place.</p>
      </div>
      <button class="add-btn" id="addTabletBtn">+</button>
    </div>

    <div id="tabletForm" class="form">
      <div class="field">
        <label>Tablet name</label>
        <input type="text" id="fName" placeholder="e.g. Metformin">
      </div>
      <div class="field">
        <label>Dosage (optional)</label>
        <input type="text" id="fDosage" placeholder="e.g. 500mg">
      </div>
      <div class="field">
        <label>Time of day</label>
        <div class="seg" id="fSlot">
          <button type="button" data-val="morning" class="active">Morning</button>
          <button type="button" data-val="afternoon">Afternoon</button>
          <button type="button" data-val="night">Night</button>
        </div>
      </div>
      <div class="field">
        <label>Relation to food</label>
        <div class="seg" id="fFood">
          <button type="button" data-val="before">Before food</button>
          <button type="button" data-val="after" class="active">After food</button>
          <button type="button" data-val="any">Anytime</button>
        </div>
      </div>
      <div class="field">
        <label>Reminder time</label>
        <input type="time" id="fTime" value="08:00">
      </div>
      <div class="form-actions">
        <button class="btn" id="fCancel">Cancel</button>
        <button class="btn primary" id="fSave" disabled>Add tablet</button>
      </div>
    </div>

    <div class="tm-list" id="tmList"></div>
    <div id="tmEmpty" class="empty-state hidden">
      📋<br><br>No tablets yet. Tap the + button to add one.
    </div>
  </div>

</div>

<div class="nav">
  <div class="nav-inner">
    <button id="navToday" class="active">Today</button>
    <button id="navMaster">Tablet Master</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- config ---------------- */
  var SLOTS = [
    {key:'morning',   label:'Morning',   window:'5:00 AM – 11:59 AM', icon:'☀', defaultTime:'08:00'},
    {key:'afternoon', label:'Afternoon', window:'12:00 PM – 5:59 PM', icon:'⛅', defaultTime:'14:00'},
    {key:'night',     label:'Night',     window:'6:00 PM – 11:59 PM', icon:'☾', defaultTime:'21:00'}
  ];
  var FOOD = {before:'Before food', after:'After food', any:'Anytime'};
  var OVERDUE_GRACE_MIN = 60;

  /* ---------------- storage (localStorage, offline) ---------------- */
  function todayKey(d){
    d = d || new Date();
    var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }
  function loadTablets(){
    try{ return JSON.parse(localStorage.getItem('tm_tablets')||'[]'); }catch(e){ return []; }
  }
  function saveTablets(list){
    try{ localStorage.setItem('tm_tablets', JSON.stringify(list)); }catch(e){}
  }
  function loadLog(dateKey){
    try{ return JSON.parse(localStorage.getItem('tm_log_'+dateKey)||'{}'); }catch(e){ return {}; }
  }
  function saveLog(dateKey, log){
    try{ localStorage.setItem('tm_log_'+dateKey, JSON.stringify(log)); }catch(e){}
  }

  /* ---------------- state ---------------- */
  var tablets = loadTablets();
  var log = loadLog(todayKey());
  var currentDateKey = todayKey();

  /* ---------------- helpers ---------------- */
  function uid(){ return 't_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); }
  function minutesSinceMidnight(hhmm){ var p=hhmm.split(':'); return (+p[0])*60+(+p[1]); }
  function formatTime(hhmm){
    var p=hhmm.split(':'); var h=+p[0], m=p[1];
    var period = h>=12 ? 'PM':'AM'; var h12 = h%12===0?12:h%12;
    return h12+':'+m+' '+period;
  }
  function greeting(now){
    var h=now.getHours();
    if(h<12) return 'Good morning';
    if(h<17) return 'Good afternoon';
    return 'Good evening';
  }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
  }

  /* ---------------- render: today view ---------------- */
  function renderToday(){
    var now = new Date();
    document.getElementById('greetingText').textContent = greeting(now);
    document.getElementById('dateText').textContent = now.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});

    var nowMinutes = now.getHours()*60 + now.getMinutes();
    var takenCount = 0, overdueCount = 0;
    var grouped = {morning:[], afternoon:[], night:[]};
    tablets.forEach(function(t){
      var taken = !!log[t.id];
      if(taken) takenCount++;
      var overdue = !taken && nowMinutes >= minutesSinceMidnight(t.time) + OVERDUE_GRACE_MIN;
      if(overdue) overdueCount++;
      grouped[t.slot] = grouped[t.slot] || [];
      grouped[t.slot].push(t);
    });
    Object.keys(grouped).forEach(function(k){ grouped[k].sort(function(a,b){ return a.time.localeCompare(b.time); }); });

    // ring
    var total = tablets.length;
    var circumference = 163.36;
    var pct = total ? takenCount/total : 0;
    document.getElementById('ringFill').style.strokeDashoffset = String(circumference*(1-pct));
    document.getElementById('ringLabel').textContent = takenCount+'/'+total;

    // banner
    var banner = document.getElementById('overdueBanner');
    if(overdueCount > 0){
      banner.classList.remove('hidden');
      document.getElementById('overdueText').textContent =
        overdueCount + (overdueCount===1 ? ' tablet is' : ' tablets are') + ' overdue — take ' + (overdueCount===1?'it':'them') + ' when you can.';
    } else {
      banner.classList.add('hidden');
    }

    // timeline
    var tl = document.getElementById('timeline');
    tl.innerHTML = '';
    SLOTS.forEach(function(slot, idx){
      var items = grouped[slot.key] || [];
      var isLast = idx === SLOTS.length-1;
      var slotDiv = document.createElement('div');
      slotDiv.className = 'slot';
      var itemsHtml = '';
      if(items.length === 0){
        itemsHtml = '<div class="slot-empty">Nothing scheduled here yet.</div>';
      } else {
        itemsHtml = '<div class="slot-items">' + items.map(renderCardHtml).join('') + '</div>';
      }
      slotDiv.innerHTML =
        '<div class="slot-rail"><div class="slot-icon">'+slot.icon+'</div>'+(isLast?'':'<div class="slot-line"></div>')+'</div>' +
        '<div class="slot-body">' +
          '<h2 class="slot-title display">'+slot.label+'</h2>' +
          '<p class="slot-window">'+slot.window+'</p>' +
          itemsHtml +
        '</div>';
      tl.appendChild(slotDiv);
    });

    // wire up checkboxes
    tl.querySelectorAll('.check').forEach(function(btn){
      btn.addEventListener('click', function(){ toggleTaken(btn.dataset.id); });
    });

    document.getElementById('todayEmpty').classList.toggle('hidden', tablets.length > 0);

    function renderCardHtml(t){
      var taken = !!log[t.id];
      var overdue = !taken && nowMinutes >= minutesSinceMidnight(t.time) + OVERDUE_GRACE_MIN;
      var cls = 'card' + (taken?' taken':'') + (overdue?' overdue':'');
      return (
        '<div class="'+cls+'">' +
          '<button class="check'+(taken?' on':'')+'" data-id="'+t.id+'">'+(taken?'✓':'')+'</button>' +
          '<div class="card-info">' +
            '<p class="card-name">'+escapeHtml(t.name)+(t.dosage?' <span style="color:var(--muted);font-weight:400;font-size:12px;">'+escapeHtml(t.dosage)+'</span>':'')+'</p>' +
            '<div class="card-meta">' +
              '<span class="time-txt">'+formatTime(t.time)+'</span>' +
              '<span class="tag '+t.food+'">'+FOOD[t.food]+'</span>' +
            '</div>' +
          '</div>' +
          (overdue ? '<span class="overdue-badge">Overdue</span>' : '') +
        '</div>'
      );
    }
  }

  function toggleTaken(id){
    log[id] = !log[id];
    saveLog(currentDateKey, log);
    renderToday();
  }

  /* ---------------- render: tablet master view ---------------- */
  function renderMaster(){
    var list = document.getElementById('tmList');
    list.innerHTML = '';
    tablets.forEach(function(t){
      var slotInfo = SLOTS.filter(function(s){ return s.key===t.slot; })[0] || SLOTS[0];
      var row = document.createElement('div');
      row.className = 'tm-row';
      row.innerHTML =
        '<div class="icon">'+slotInfo.icon+'</div>' +
        '<div class="info">' +
          '<p>'+escapeHtml(t.name)+(t.dosage?' <span style="color:var(--muted);font-weight:400;font-size:12px;">'+escapeHtml(t.dosage)+'</span>':'')+'</p>' +
          '<span class="sub">'+slotInfo.label+' · '+formatTime(t.time)+' · '+FOOD[t.food]+'</span>' +
        '</div>' +
        '<button class="icon-btn" data-act="del" data-id="'+t.id+'" title="Delete">✕</button>';
      list.appendChild(row);
    });
    list.querySelectorAll('[data-act="del"]').forEach(function(btn){
      btn.addEventListener('click', function(){ deleteTablet(btn.dataset.id); });
    });
    document.getElementById('tmEmpty').classList.toggle('hidden', tablets.length > 0);
  }

  function deleteTablet(id){
    tablets = tablets.filter(function(t){ return t.id !== id; });
    saveTablets(tablets);
    delete log[id];
    saveLog(currentDateKey, log);
    renderMaster();
    renderToday();
  }

  /* ---------------- form handling ---------------- */
  var formState = {slot:'morning', food:'after'};
  function wireSeg(containerId, stateKey, onChange){
    var container = document.getElementById(containerId);
    container.querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click', function(){
        container.querySelectorAll('button').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        formState[stateKey] = btn.dataset.val;
        if(onChange) onChange(btn.dataset.val);
      });
    });
  }
  wireSeg('fSlot', 'slot', function(val){
    var slotInfo = SLOTS.filter(function(s){ return s.key===val; })[0];
    document.getElementById('fTime').value = slotInfo.defaultTime;
  });
  wireSeg('fFood', 'food');

  function updateSaveEnabled(){
    document.getElementById('fSave').disabled = document.getElementById('fName').value.trim().length === 0;
  }
  document.getElementById('fName').addEventListener('input', updateSaveEnabled);

  function openForm(){
    document.getElementById('fName').value = '';
    document.getElementById('fDosage').value = '';
    document.getElementById('fTime').value = '08:00';
    formState = {slot:'morning', food:'after'};
    document.getElementById('fSlot').querySelectorAll('button').forEach(function(b,i){ b.classList.toggle('active', i===0); });
    document.getElementById('fFood').querySelectorAll('button').forEach(function(b){ b.classList.toggle('active', b.dataset.val==='after'); });
    document.getElementById('tabletForm').classList.add('open');
    updateSaveEnabled();
    document.getElementById('fName').focus();
  }
  function closeForm(){ document.getElementById('tabletForm').classList.remove('open'); }

  document.getElementById('addTabletBtn').addEventListener('click', function(){
    var form = document.getElementById('tabletForm');
    if(form.classList.contains('open')) closeForm(); else openForm();
  });
  document.getElementById('fCancel').addEventListener('click', closeForm);
  document.getElementById('fSave').addEventListener('click', function(){
    var name = document.getElementById('fName').value.trim();
    if(!name) return;
    var tablet = {
      id: uid(),
      name: name,
      dosage: document.getElementById('fDosage').value.trim(),
      slot: formState.slot,
      food: formState.food,
      time: document.getElementById('fTime').value || '08:00'
    };
    tablets.push(tablet);
    saveTablets(tablets);
    closeForm();
    renderMaster();
    renderToday();
  });

  /* ---------------- nav ---------------- */
  function showView(name){
    document.getElementById('todayView').classList.toggle('active', name==='today');
    document.getElementById('masterView').classList.toggle('active', name==='master');
    document.getElementById('navToday').classList.toggle('active', name==='today');
    document.getElementById('navMaster').classList.toggle('active', name==='master');
    if(name==='master') closeForm();
  }
  document.getElementById('navToday').addEventListener('click', function(){ showView('today'); });
  document.getElementById('navMaster').addEventListener('click', function(){ showView('master'); });

  /* ---------------- clock tick: catch overdue state + date rollover ---------------- */
  setInterval(function(){
    var k = todayKey();
    if(k !== currentDateKey){
      currentDateKey = k;
      log = loadLog(k);
    }
    renderToday();
  }, 30000);

  /* ---------------- boot ---------------- */
  renderToday();
  renderMaster();
})();
</script>
</body>
</html>
